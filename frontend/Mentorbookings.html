<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Mentor Bookings</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="MentorDashboardStyleSheet.css">
    <link rel="stylesheet" href="MentorBookingsStyleSheet.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar">
        <div class="logo-area" onclick="window.location.href='MentorDashboard.html'">
            <img src="PROJECT 3 LOGO 2  3.png" alt="logo" class="logo-img" onerror="this.src='https://via.placeholder.com/38x38?text=FP'">
            <div class="logo-text">Find<span class="green">Your</span>Path</div>
        </div>

        <div class="admin-card">
            <img class="admin-avatar" id="bookingSidebarAvatar" alt="">
            <div>
                <div class="admin-name" id="sidebarName">Mentor</div>
                <div class="admin-role" id="sidebarRole">Mentor</div>
                <div class="admin-status"><span class="dot"></span> Online</div>
            </div>
        </div>

        <ul>
            <li data-nav="dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</li>
            <li data-nav="users"><i class="fas fa-users"></i> Users</li>
            <li class="active" data-nav="booking"><i class="far fa-calendar-alt"></i> Bookings</li>
            <li data-nav="calendar"><i class="fas fa-calendar-days"></i> Calendar</li>
            <li data-nav="messages"><i class="far fa-comment-dots"></i> Messages</li>
            <li data-nav="settings"><i class="fas fa-cog"></i> Settings</li>
        </ul>

        <div class="sidebar-footer">
            <div class="promo-card">
                <img src="PROJECT 3 LOGO.png" alt="Promo" class="promo-img">
                <div class="promo-text">
                    Real guidance.<br>Local mentors.<br>Brighter futures.
                </div>
            </div>
        </div>
    </aside>

    <div class="main-area">
        <header class="top-bar">
            <div class="welcome-block">
                <h1>Bookings</h1>
                <p>Students who asked to book a session with you.</p>
            </div>
            <div class="top-bar-right">
                <div class="profile-preview" id="profileBtn">
                    <img class="admin-avatar" id="bookingProfileAvatar" alt="profile">
                    <div class="info">
                        <div class="name" id="profileName">Mentor</div>
                        <div class="role" id="profileRole">Mentor</div>
                    </div>
                </div>
            </div>
        </header>

        <main class="page-content">
            <div class="booking-filters" id="filters">
                <button class="filter-btn active" data-filter="all">All <span id="countAll">0</span></button>
                <button class="filter-btn" data-filter="pending">Pending <span id="countPending">0</span></button>
                <button class="filter-btn" data-filter="confirmed">Confirmed <span id="countConfirmed">0</span></button>
                <button class="filter-btn" data-filter="declined">Declined <span id="countDeclined">0</span></button>
            </div>

            <div class="booking-list" id="bookingList"></div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script src="bookings.js"></script>
<script>
    if (typeof initMentorNav === 'function') initMentorNav();

    let currentFilter = 'all';
    let bookings = [];
    const listEl = document.getElementById('bookingList');

    const COVER_GRADIENTS = [
        ['#c0e0c8', '#b8d4e3'],
        ['#b8d4e3', '#c9d6f2'],
        ['#d4e8c2', '#a8d5ba'],
        ['#c9d6f2', '#c0e0c8'],
        ['#a8d5ba', '#b8d4e3']
    ];

    function initials(name) {
        return (name || '?').split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
    }

    function coverFor(name) {
        const hash = [...String(name || '')].reduce((a, c) => a + c.charCodeAt(0), 0);
        const [c1, c2] = COVER_GRADIENTS[hash % COVER_GRADIENTS.length];
        return `linear-gradient(130deg, ${c1}, ${c2})`;
    }

    function formatSlot(b) {
        if (b.status !== 'confirmed') return 'Not scheduled yet';
        const d = new Date(b.session_date + 'T00:00');
        const day = d.toLocaleDateString('en-ZA', { weekday: 'short', day: 'numeric', month: 'short' });
        return day + ', ' + (b.start_time || '').slice(0, 5) + ' – ' + (b.end_time || '').slice(0, 5);
    }

    function showMessage(text) {
        listEl.innerHTML = '';
        const el = document.createElement('div');
        el.className = 'empty-state';
        el.textContent = text;
        listEl.appendChild(el);
    }

    function render() {
        ['all', 'pending', 'confirmed', 'declined'].forEach(s => {
            const n = s === 'all' ? bookings.length : bookings.filter(b => b.status === s).length;
            const el = document.getElementById('count' + s[0].toUpperCase() + s.slice(1));
            if (el) el.textContent = n;
        });

        const items = currentFilter === 'all' ? bookings : bookings.filter(b => b.status === currentFilter);

        if (items.length === 0) {
            showMessage(bookings.length === 0
                ? 'No booking requests yet. When a student presses Book on your card, the request shows up here.'
                : 'No ' + currentFilter + ' bookings.');
            return;
        }

        listEl.innerHTML = '';
        items.forEach(b => {
            const row = document.createElement('a');
            row.className = 'booking-row';
            row.href = 'MentorBookingDetails.html?id=' + encodeURIComponent(b.id);

            const cover = document.createElement('div');
            cover.className = 'booking-cover';
            cover.style.background = coverFor(b.student_name);

            const avatarWrap = document.createElement('div');
            avatarWrap.className = 'booking-avatar-wrapper';
            const avatar = document.createElement('div');
            avatar.className = 'booking-avatar';
            avatar.textContent = initials(b.student_name);
            avatarWrap.appendChild(avatar);

            // Info block
            const info = document.createElement('div');
            info.className = 'booking-info';

            const name = document.createElement('div');
            name.className = 'booking-student';
            name.textContent = b.student_name || 'Student';

            const meta = document.createElement('div');
            meta.className = 'booking-meta';
            meta.textContent = b.message ? b.message : 'Wants to book a session with you';

            const when = document.createElement('div');
            when.className = 'booking-when';
            when.innerHTML = '<i class="far fa-calendar-alt"></i> ' + formatSlot(b);

            const side = document.createElement('div');
            side.className = 'booking-side';

            const badge = document.createElement('span');
            badge.className = 'status-badge ' + (b.status || 'pending');
            badge.textContent = (b.status || 'pending').charAt(0).toUpperCase() + (b.status || 'pending').slice(1);

            const req = document.createElement('div');
            req.className = 'booking-requested';
            req.textContent = 'Requested ' + new Date(b.created_at).toLocaleDateString('en-ZA', { day: 'numeric', month: 'short' });

            side.append(badge, req);
            info.append(name, meta, when, side);
            row.append(cover, avatarWrap, info);
            listEl.appendChild(row);
        });
    }

    async function load() {
        try {
            if (typeof BookingStore !== 'undefined' && BookingStore.forMentor) {
                bookings = await BookingStore.forMentor();
            } else {
                bookings = [];
            }
            render();
        } catch (err) {
            console.error(err);
            showMessage('Could not load bookings. Check that you are signed in and that the bookings table exists.');
        }
    }

    document.getElementById('filters').addEventListener('click', e => {
        const btn = e.target.closest('.filter-btn');
        if (!btn) return;
        currentFilter = btn.dataset.filter;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b === btn));
        render();
    });

    window.addEventListener('focus', load);
    load();

    function loadUserIntoDashboard() {
        const raw = localStorage.getItem('careerUser');
        if (!raw) {
            window.location.href = 'Register.html';
            return;
        }

        const user = JSON.parse(raw);
        const fullName = user.fullname || 'Mentor';

        const profileName = document.getElementById('profileName');
        const profileRole = document.getElementById('profileRole');
        if (profileName) profileName.textContent = fullName;
        if (profileRole) profileRole.textContent = user.role || 'Mentor';

        const sidebarName = document.getElementById('sidebarName');
        const sidebarRole = document.getElementById('sidebarRole');
        if (sidebarName) sidebarName.textContent = fullName;
        if (sidebarRole) sidebarRole.textContent = user.role || 'Mentor';
    }

    async function loadMentorPhoto() {
        const imgs = [
            document.getElementById('bookingSidebarAvatar'),
            document.getElementById('bookingProfileAvatar')
        ].filter(Boolean);
        if (!imgs.length) return;

        try {
            const { data } = await (window.sb || window.supabaseClient).auth.getUser();
            if (!data || !data.user) return;

            const raw = localStorage.getItem('careerUser');
            const name = (raw && JSON.parse(raw).fullname) || 'Mentor';
            const fallback = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(name) + '&background=e8f5e9&color=2e7d32';

            let photo = null;
            if (typeof mentorPhotoUrl === 'function') {
                photo = await mentorPhotoUrl(data.user.id);
            }

            imgs.forEach(img => {
                img.onerror = () => { img.onerror = null; img.src = fallback; };
                img.src = photo || fallback;
                img.alt = name;
            });
        } catch (e) {
            console.error('Could not load profile picture:', e);
        }
    }

    loadUserIntoDashboard();
    loadMentorPhoto();
</script>
</body>
</html>
