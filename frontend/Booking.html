<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FindYourPath - Bookings & Sessions</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="messageStyle.css">
    <link rel="stylesheet" href="studentLayout.css">
    <link rel="stylesheet" href="Booking.css">
</head>
<body>
    <!-- Header & Sidebar Placeholders -->
    <student-header active-page="booking"></student-header>

    <div class="main-layout">
        <student-sidebar active="booking"></student-sidebar>

        <main class="page-content">
            <div class="page-header">
                <div>
                    <h1>Bookings & Sessions</h1>
                    <p>Book a private session with a mentor, or join upcoming group sessions.</p>
                </div>
            </div>

            <!-- SLIDING TOGGLE -->
            <div class="pill-toggle-container">
                <div class="pill-toggle" id="pillToggle">
                    <div class="pill-slider"></div>
                    <button type="button" class="pill-option active" id="btn-book" onclick="switchTab('book')">Book a Mentor</button>
                    <button type="button" class="pill-option" id="btn-sessions" onclick="switchTab('sessions')">Public Sessions</button>
                </div>
            </div>

            <!-- TAB 1: BOOK MENTOR -->
            <div id="tab-book" class="tab-content active">
                <div class="mentor-grid" id="bookingGrid">
                    <div style="padding:20px; color:#64748b;">Loading your connections...</div>
                </div>
            </div>

            <!-- TAB 2: SESSIONS -->
            <div id="tab-sessions" class="tab-content">
                <div class="session-list" id="sessionList">
                    <div style="padding:20px; color:#64748b;">Loading sessions...</div>
                </div>
            </div>
        </main>
    </div>

    <!-- BOOKING FORM MODAL -->
    <div class="modal-overlay" id="bookingModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
            <h2 id="modalMentorName">Book a Session</h2>
            <p style="color:#64748b; margin-bottom:15px; font-size:0.9rem;">Select one of the available timeslots provided by your mentor.</p>
            
            <form id="bookingForm" onsubmit="submitBooking(event)">
                <input type="hidden" id="modalMentorId">
                
                <label>Available Timeslots</label>
                <select id="modalTimeslot" required>
                    <option value="">Loading available times...</option>
                </select>

                <label>Session Title</label>
                <input type="text" id="modalTitle" placeholder="Enter a title for your session" required>

                <label>Session Format</label>
                <select id="modalTopic" required>
                    <option value="Online">Online</option>
                    <option value="In person">In person</option>
                </select>

                <button type="submit" class="book-btn" id="modalSubmitBtn">Confirm Booking</button>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    
    <!-- Load Layout Script -->
    <script src="studentLayout.js"></script>
    
    <!-- Load Page Logic -->
    <script type="module" src="Booking2.js"></script>
</body>
</html>
