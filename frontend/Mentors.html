<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FindYourPath — Mentors & Community</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; }
        body { background-color: #f4f7fc; display: flex; flex-direction: column; min-height: 100vh; }
        button { font-family: inherit; }
        :focus-visible { outline: 3px solid rgba(46,125,50,.45); outline-offset: 2px; }

        /* ===== TOP NAV ===== */
        .top-nav { background: #fff; display: flex; align-items: center; justify-content: space-between; padding: 12px 32px; border-bottom: 1px solid #e2e8f0; flex-wrap: wrap; gap: 16px; }
        .logo-area { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .logo-img { width: 38px; height: 38px; object-fit: contain; }
        .logo-text { font-weight: 800; font-size: 1.5rem; letter-spacing: -0.3px; color: #1e3a5f; }
        .logo-text .green { color: #2e7d32; }
        .nav-middle { display: flex; gap: 28px; }
        .nav-middle a { text-decoration: none; font-weight: 600; color: #1e293b; font-size: .95rem; transition: .2s; padding: 6px 0; cursor: pointer; }
        .nav-middle a.active { background: #1e3a5f; color: #fff; padding: 8px 18px; border-radius: 40px; }
        .nav-middle a:not(.active):hover { color: #2e7d32; }
        .nav-tools { display: flex; gap: 16px; align-items: center; }
        .search-input { padding: 8px 16px; border-radius: 40px; border: 1px solid #cbd5e1; background: #fff; width: 240px; font-size: .85rem; outline: none; transition: .2s; }
        .search-input:focus { border-color: #2e7d32; box-shadow: 0 0 0 2px rgba(46,125,50,.2); }
        .right-actions { display: flex; align-items: center; gap: 20px; position: relative; }
        .icon-group { display: flex; gap: 18px; align-items: center; }
        .icon-btn { position: relative; font-size: 1.2rem; cursor: pointer; color: #5b6e8c; transition: color .2s; background: none; border: none; }
        .icon-btn:hover { color: #2e7d32; }
        .badge { position: absolute; top: -8px; right: -10px; background: #2e7d32; color: #fff; font-size: .65rem; font-weight: bold; padding: 2px 6px; border-radius: 40px; line-height: 1; }
        .divider-vertical { width: 1px; height: 32px; background: #e2e8f0; }
        .profile-preview { display: flex; align-items: center; gap: 10px; cursor: pointer; background: none; border: none; text-align: left; }
        .profile-preview img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid #e9f5eb; }
        .profile-preview .info { line-height: 1.3; }
        .profile-preview .name { font-weight: 700; font-size: .9rem; color: #0f172a; }
        .profile-preview .role { font-size: .7rem; color: #5b6e8c; }
        .arrow-down { font-size: .7rem; color: #5b6e8c; }
        .dropdown-menu { position: absolute; top: 54px; right: 0; background: #fff; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,.1); width: 200px; display: none; z-index: 100; overflow: hidden; }
        .dropdown-menu.show { display: block; }
        .dropdown-menu a { display: block; padding: 12px 20px; text-decoration: none; color: #1e293b; transition: .2s; }
        .dropdown-menu a:hover { background: #f1f5f9; color: #2e7d32; }

        /* ===== LAYOUT ===== */
        .app-layout { display: flex; flex: 1; }
        .sidebar { width: 260px; background: #fff; border-right: 1px solid #e9eef3; padding: 28px 16px; display: flex; flex-direction: column; justify-content: space-between; }
        .sidebar ul { list-style: none; }
        .sidebar li a { padding: 12px 16px; margin: 4px 0; font-size: .95rem; font-weight: 500; color: #2c3e50; border-radius: 14px; text-decoration: none; transition: all .2s; display: flex; align-items: center; gap: 12px; }
        .sidebar li a i { width: 20px; font-size: 1rem; color: #5b6e8c; }
        .sidebar li a.active { background: #e8f5e9; color: #2e7d32; font-weight: 700; }
        .sidebar li a.active i { color: #2e7d32; }
        .sidebar li a:hover:not(.active) { background: #f1f5f9; }
        .sidebar-footer { margin-top: 40px; padding: 20px 12px; text-align: center; background: #f8fafc; border-radius: 20px; cursor: pointer; transition: .2s; }
        .sidebar-footer:hover { background: #eef2ff; }
        .footer-logo { width: 80px; height: 80px; object-fit: contain; margin-bottom: 16px; }
        .footer-text { font-size: .85rem; font-weight: 500; color: #1e3a5f; line-height: 1.6; }
        .footer-text strong { font-size: .9rem; display: block; margin-bottom: 4px; font-weight: 700; }
        .main-content { flex: 1; padding: 28px 32px; background: #f8fafc; min-width: 0; }

        /* ===== TABS + FILTER ===== */
        .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
        .tabs-header { display: flex; gap: 12px; }
        .tab-btn { border: 2px solid #1e3a5f; padding: 8px 24px; border-radius: 40px; font-weight: 600; font-size: .9rem; cursor: pointer; transition: .2s; background: #fff; color: #1e3a5f; }
        .tab-btn:hover { background: #eef2f8; }
        .tab-btn.active { background: #1e3a5f; color: #fff; }
        .tab-btn.active:hover { background: #15304e; }
        .location-select { padding: 9px 16px; border-radius: 40px; border: 1px solid #cbd5e1; background: #fff; font-size: .85rem; color: #1e293b; cursor: pointer; }
        .result-count { font-size: .85rem; color: #5b6e8c; margin-bottom: 16px; }

        /* ===== CARDS ===== */
        .mentors-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 28px; }
        .card { background: #fff; border-radius: 24px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,.03), 0 2px 6px rgba(0,0,0,.05); transition: transform .2s, box-shadow .2s; cursor: pointer; }
        .card:hover, .card:focus-visible { transform: translateY(-4px); box-shadow: 0 20px 30px -12px rgba(0,0,0,.1); }
        .card-cover { height: 95px; background: linear-gradient(130deg, #c0e0c8, #b8d4e3); background-size: cover; background-position: center; }
        .avatar-wrapper { text-align: center; margin-top: -38px; }
        .avatar-wrapper img { width: 78px; height: 78px; border-radius: 50%; border: 4px solid #fff; object-fit: cover; box-shadow: 0 4px 8px rgba(0,0,0,.05); background: #fff; }
        .card-info { text-align: center; padding: 12px 18px 24px; }
        .card-info h3 { font-size: 1.25rem; font-weight: 700; margin: 8px 0 4px; color: #0f172a; }
        .job-title { font-size: .8rem; color: #475569; margin-bottom: 6px; font-weight: 500; }
        .card-location { font-size: .75rem; color: #5b6e8c; margin-bottom: 16px; }
        .card-location i { margin-right: 4px; }
        .follow-button { background: transparent; border: 2px solid #2e7d32; color: #2e7d32; padding: 8px 24px; border-radius: 40px; font-weight: 700; font-size: .85rem; cursor: pointer; transition: .2s; }
        .follow-button:hover, .follow-button.following { background: #2e7d32; color: #fff; }
        .follow-button:disabled { opacity: .6; cursor: wait; }

        /* ===== STATES ===== */
        .state-box { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: #5b6e8c; }
        .state-box i { font-size: 44px; margin-bottom: 16px; display: block; }
        .state-box p.sub { font-size: .85rem; margin-top: 8px; }
        .state-box.error { color: #dc2626; }
        .retry-btn { margin-top: 18px; background: #1e3a5f; color: #fff; border: none; padding: 9px 22px; border-radius: 40px; font-weight: 600; cursor: pointer; }
        .demo-banner { background: #fff8e1; border: 1px solid #ffe08a; color: #7a5b00; padding: 10px 16px; border-radius: 12px; font-size: .85rem; margin-bottom: 20px; }
        .skeleton { height: 280px; border-radius: 24px; background: linear-gradient(90deg, #eef2f6 25%, #e3e9f0 50%, #eef2f6 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; }
        @keyframes shimmer { to { background-position: -200% 0; } }

        /* ===== MODAL ===== */
        .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.55); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 500; }
        .modal-overlay.show { display: flex; }
        .modal { background: #fff; border-radius: 24px; width: 100%; max-width: 420px; overflow: hidden; position: relative; }
        .modal .card-info { padding-bottom: 28px; }
        .modal-close { position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,.9); border: none; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 1rem; color: #1e3a5f; }
        .modal-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .book-button { background: #1e3a5f; border: 2px solid #1e3a5f; color: #fff; padding: 8px 24px; border-radius: 40px; font-weight: 700; font-size: .85rem; cursor: pointer; }
        .book-button:hover { background: #15304e; }

        /* ===== TOAST ===== */
        .toast { position: fixed; bottom: 30px; right: 30px; background: #2e7d32; color: #fff; padding: 12px 24px; border-radius: 12px; font-size: .9rem; z-index: 1000; animation: slideIn .3s ease; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
        .toast.error { background: #dc2626; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

        @media (max-width: 950px) {
            .top-nav { padding: 12px 20px; }
            .nav-middle { order: 3; width: 100%; justify-content: center; gap: 20px; }
            .sidebar { width: 220px; }
            .main-content { padding: 24px 20px; }
        }
        @media (max-width: 700px) {
            .app-layout { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid #e2e8f0; padding: 16px; }
            .sidebar ul { display: flex; flex-wrap: wrap; gap: 4px; }
            .sidebar li a { padding: 8px 12px; font-size: .85rem; }
            .sidebar-footer { display: none; }
            .top-nav { padding: 12px 15px; }
            .nav-tools { width: 100%; justify-content: space-between; }
            .search-input { width: 100%; min-width: 0; }
            .profile-preview .info { display: none; }
        }
    </style>
</head>
<body>

<!-- TOP NAVIGATION -->
<header class="top-nav">
    <div class="logo-area" id="logoArea">
        <img src="PROJECT.png" alt="FindYourPath logo" class="logo-img" onerror="this.src='https://via.placeholder.com/38x38?text=FP'">
        <div class="logo-text">Find<span class="green">Your</span>Path</div>
    </div>

    <nav class="nav-middle" aria-label="Main">
        <a href="Dashboard.html">Home</a>
        <a href="Mentors.html" class="active" aria-current="page">Find Mentor</a>
        <a href="EncouragementWall.html">Encouragement</a>
        <a href="InformationTechnology.html">Resources</a>
    </nav>

    <div class="nav-tools">
        <input type="search" class="search-input" id="searchInput" placeholder="Search mentor by name or role..." aria-label="Search mentors">

        <div class="right-actions">
            <div class="icon-group">
                <button class="icon-btn" id="notificationBtn" aria-label="Notifications" type="button">
                    <i class="far fa-bell"></i>
                    <span class="badge" id="notificationBadge">3</span>
                </button>
                <button class="icon-btn" id="messageBtn" aria-label="Messages" type="button">
                    <i class="far fa-comment-dots"></i>
                </button>
            </div>

            <div class="divider-vertical"></div>

            <button class="profile-preview" id="profileBtn" type="button" aria-haspopup="true">
                <img id="profileImg" src="https://ui-avatars.com/api/?name=Student&background=e2e8f0&color=64748b" alt="Your profile">
                <div class="info">
                    <div class="name" id="profileName">Student</div>
                    <div class="role" id="profileRole">Student</div>
                </div>
                <span class="arrow-down"><i class="fas fa-chevron-down"></i></span>
            </button>

            <div class="dropdown-menu" id="dropdownMenu">
                <a href="#" data-soon="Profile"><i class="fas fa-user"></i> My Profile</a>
                <a href="Settings.html"><i class="fas fa-cog"></i> Settings</a>
                <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Log out</a>
            </div>
        </div>
    </div>
</header>

<!-- MAIN LAYOUT -->
<div class="app-layout">

    <aside class="sidebar">
        <ul>
            <li><a href="Dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
            <li><a href="Messages.html"><i class="far fa-envelope"></i> Messages</a></li>
            <li><a href="Booking.html"><i class="far fa-calendar-alt"></i> Booking</a></li>
            <li><a href="Mentors.html" class="active"><i class="fas fa-users"></i> Mentors</a></li>
            <li><a href="EncouragementWall.html"><i class="fas fa-globe"></i> Encouragement Cards</a></li>
            <li><a href="ExperianceWall.html"><i class="fas fa-folder-open"></i> Experiences</a></li>
            <li><a href="Settings.html"><i class="fas fa-cog"></i> Settings</a></li>
            <li><a href="HelpAndSupport.html"><i class="far fa-question-circle"></i> Help &amp; Support</a></li>
            <li><a href="#" id="sidebarLogout"><i class="fas fa-sign-out-alt"></i> Log out</a></li>
        </ul>

        <div class="sidebar-footer" id="aboutFooter">
            <img src="PROJECT.png" alt="" class="footer-logo" onerror="this.src='https://via.placeholder.com/80x80?text=FP'">
            <div class="footer-text">
                <strong>Real guidance.</strong>
                <strong>Local mentors.</strong>
                <strong>Brighter futures.</strong>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <div class="toolbar">
            <div class="tabs-header" role="tablist">
                <button class="tab-btn active" id="allTab" type="button" role="tab" aria-selected="true">All</button>
                <button class="tab-btn" id="followingTab" type="button" role="tab" aria-selected="false">Following</button>
            </div>
            <select class="location-select" id="locationFilter" aria-label="Filter by location">
                <option value="">All locations</option>
            </select>
        </div>

        <div id="demoBanner" class="demo-banner" hidden></div>
        <p class="result-count" id="resultCount" aria-live="polite"></p>

        <div class="mentors-grid" id="mentorsGrid">
            <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
        </div>
    </main>
</div>

<!-- MENTOR DETAILS MODAL -->
<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalName">
    <div class="modal" id="modalBody"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script src="Mentors.js"></script>
</body>
</html>
