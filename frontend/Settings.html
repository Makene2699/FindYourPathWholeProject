<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | FindYourPath</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Shared layout (same files and order as the other student pages) -->
    <link rel="stylesheet" href="messageStyle.css">
    <link rel="stylesheet" href="studentLayout.css">

    <!-- Settings page only, loaded last -->
    <link rel="stylesheet" href="SettingsStyleSheet.css">

    <script src="studentLayout.js"></script>
</head>

<body>

<!-- Shared header and sidebar -->
<student-header active-page=""></student-header>

<div class="main-layout">
    <student-sidebar active="settings"></student-sidebar>

    <main class="page-content">
        <div class="st">

            <h1>Settings</h1>

            <div id="settingsStatus" role="status" aria-live="polite">
                Profile ready
            </div>

            <div class="settings-content">

                <!-- PROFILE INFORMATION -->
                <section class="profile-card">

                    <h2>Profile Information</h2>

                    <div class="profile-form-layout">

                        <!-- PROFILE PICTURE -->
                        <div class="profile-picture-section">

                            <div class="profile-avatar" id="settingsAvatar">
                                <span id="profileInitials">?</span>
                                <img id="profileImage"
                                     alt="Profile Picture"
                                     style="display:none;">
                            </div>

                            <input type="file"
                                   id="profilePictureInput"
                                   accept="image/png,image/jpeg,image/webp"
                                   hidden>

                            <button type="button" id="changePictureBtn">
                                <i class="fas fa-camera"></i>
                                Change Picture
                            </button>

                            <p id="pictureStatus" aria-live="polite"></p>
                        </div>

                        <!-- PROFILE FORM -->
                        <div class="form-fields">

                            <div class="form-group">
                                <label for="fullName">Full Name</label>
                                <input type="text" id="fullName" placeholder="Full Name">
                            </div>

                            <div class="form-group">
                                <label for="email">Email Address</label>
                                <input type="email" id="email" placeholder="Email Address">
                            </div>

                            <div class="form-group">
                                <label for="phone">Phone Number</label>
                                <input type="tel" id="phone" placeholder="Phone Number">
                            </div>

                            <div class="form-group">
                                <label for="location">Location</label>
                                <input type="text" id="location" placeholder="Location">
                            </div>

                            <div class="form-group">
                                <label for="bio">Bio</label>
                                <textarea id="bio" placeholder="Tell us about yourself..."></textarea>
                            </div>

                            <button type="button" id="saveBtn">
                                Save Changes
                            </button>

                        </div>
                    </div>
                </section>

                <!-- QUICK LINKS -->
                <aside class="quick-links-card">
                    <h3>Quick Links</h3>
                    <ul>
                        <li class="quick-link">
                            <span>Change Password</span>
                            <i class="fa-solid fa-chevron-right"></i>
                        </li>
                    </ul>
                </aside>

            </div>
        </div>
    </main>
</div>

<!-- JAVASCRIPT (order matters) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script src="bookings.js"></script>
<script src="studentBookingNotifications.js"></script>
<script src="studentSearch.js"></script>
<script src="Settings.js"></script>

</body>
</html>
