<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Your Path - Encouragement Wall</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Shared layout (same files and order as Booking and Mentors) -->
    <link rel="stylesheet" href="messageStyle.css">
    <link rel="stylesheet" href="studentLayout.css">

    <!-- Encouragement wall only, loaded last -->
    <link rel="stylesheet" href="EncouragementWallStyleSheet.css">

    <script src="studentLayout.js"></script>
</head>
<body>

<!-- Shared header and sidebar -->
<student-header active-page="encouragement"></student-header>

<div class="main-layout">
    <student-sidebar active="encouragement"></student-sidebar>

    <main class="page-content">
        <div class="ew">

            <section class="encouragement-wall card">
                <h1 class="wall-title">Encouragement Wall</h1>
                <div class="create-card-input card">
                    <input type="text" id="newCardText" placeholder="Create a card">
                    <button class="post-btn" onclick="addCard()">post</button>
                </div>
                <div class="cards-grid" id="cardsGrid"></div>
            </section>

            <aside class="mentors-sidebar card">
                <h2 class="mentors-title">Mentors for you</h2>
                <div class="mentors-list" id="mentorsList"></div>
            </aside>

        </div>
    </main>
</div>

<!-- Supabase connection and page logic (order matters) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabaseClient.js"></script>
<script src="Experience.js"></script>
<script src="bookings.js"></script>
<script src="studentProfile.js"></script>
<script src="studentBookingNotifications.js"></script>
<script src="studentSearch.js"></script>
<script src="EncouragementWall.js"></script>

<script>
    // "Mentors for you": real mentors from the same list the Mentors page uses
    (async function () {
        var list = document.getElementById('mentorsList');
        if (!list) return;

        function esc(v) {
            return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }
        function avatar(name) {
            return 'https://ui-avatars.com/api/?name=' + encodeURIComponent(name) +
                '&background=e8f5e9&color=2e7d32';
        }
        function note(text) {
            list.innerHTML = '<p style="color:#5b6e8c;font-size:.85rem;">' + text + '</p>';
        }

        var client = window.sb;
        if (!client) { note('Mentors are unavailable right now.'); return; }

        var res = await client
            .from('mentors_public')
            .select('id, full_name, job_title, company, location, avatar_url');

        if (res.error) {
            console.error('Mentors for you failed:', res.error);
            note('Could not load mentors.');
            return;
        }

        var me = null;
        try { me = JSON.parse(localStorage.getItem('careerUser') || 'null'); } catch (e) {}

        var mentors = (res.data || [])
            .filter(function (m) { return !me || String(m.id) !== String(me.id); })
            .sort(function () { return Math.random() - 0.5; })
            .slice(0, 5);

        if (!mentors.length) { note('No mentors have registered yet.'); return; }

        list.innerHTML = mentors.map(function (m) {
            var name = m.full_name || 'Mentor';
            var role = [m.job_title, m.company, m.location].filter(Boolean).join(' | ') || 'Mentor';
            var pic = /^https?:\/\//i.test(m.avatar_url || '') ? m.avatar_url : avatar(name);
            return '<div class="mentor-item">' +
                '<img src="' + esc(pic) + '" alt="' + esc(name) + '" class="mentor-pic" ' +
                'onerror="this.onerror=null;this.src=\'' + esc(avatar(name)) + '\'">' +
                '<div class="mentor-details">' +
                '<span class="mentor-name">' + esc(name) + '</span>' +
                '<span class="mentor-role">' + esc(role) + '</span>' +
                '</div></div>';
        }).join('');
    })();
</script>

</body>
</html>
